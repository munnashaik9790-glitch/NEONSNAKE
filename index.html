<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Snake | Premium Game Experience</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="game-container">
        <header>
            <div class="brand">
                <h1>NEON<span>SNAKE</span></h1>
            </div>
            <div class="score-board">
                <div class="score-item">
                    <span class="label">SCORE</span>
                    <span id="score" class="value">000</span>
                </div>
                <div class="score-item">
                    <span class="label">HIGH SCORE</span>
                    <span id="high-score" class="value">000</span>
                </div>
            </div>
        </header>

        <div class="game-board-wrapper">
            <canvas id="game-canvas"></canvas>
            
            <!-- Overlay screens -->
            <div id="start-screen" class="overlay">
                <div class="overlay-content">
                    <h2>READY?</h2>
                    <p>Use arrow keys or swipe to move</p>
                    <button id="start-btn" class="primary-btn">START GAME</button>
                </div>
            </div>

            <div id="game-over-screen" class="overlay hidden">
                <div class="overlay-content">
                    <h2 class="danger">GAME OVER</h2>
                    <p>Your score: <span id="final-score">0</span></p>
                    <button id="restart-btn" class="primary-btn">PLAY AGAIN</button>
                </div>
            </div>
        </div>

        <div class="mobile-controls">
            <button class="ctrl-btn" id="ctrl-up">▲</button>
            <div class="ctrl-row">
                <button class="ctrl-btn" id="ctrl-left">◄</button>
                <button class="ctrl-btn" id="ctrl-down">▼</button>
                <button class="ctrl-btn" id="ctrl-right">►</button>
            </div>
        </div>
        
        <footer class="game-footer">
            <p>Collect neon orbs to grow. Don't hit the walls!</p>
        </footer>
    </div>

    <!-- Audio elements (handled via JS for simplicity) -->
    <script src="script.js"></script>
</body>
</html>
